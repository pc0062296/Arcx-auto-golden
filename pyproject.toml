[build-system]
requires = ["setuptools>=45"]
build-backend = "setuptools.build_meta"

[project]
name = "arcx-auto-golden"
version = "0.1.0"
description = "Automated submission, monitoring, QA and rerun for Arcx RC extraction"
requires-python = ">=3.9"
# Zero third-party dependencies in the core. PyYAML is imported lazily and
# only when reading a .yaml settings file; use .json instead if absent.
dependencies = []

[project.optional-dependencies]
yaml = ["PyYAML>=5.1"]

[project.scripts]
arcx-auto = "arcx_auto.cli.main:main"

[tool.setuptools.packages.find]
include = ["arcx_auto*"]
