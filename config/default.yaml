# Arcx Auto Golden default settings
#
# This file is optional: every field has a built-in default, so the tools run
# without a settings file at all. Write down only what you want to override.
#
# Search order:  ./arcx_auto.yaml  ->  ~/.arcx-auto/config/default.yaml
# Or point at one explicitly with -c/--config (.yaml or .json).
# Without PyYAML on the network, use the .json form; the structure is identical.

state_root: "~/.arcx-auto"     # per-user state (state.json, events, audit)
run_root: "./arcx_runs"        # root for the isolated wave directories

# ---------------------------------------------------------------------------
# File conventions (architecture 9.3)
#
# Every assumption about the outside world lives here rather than in code, so
# a change in Arcx conventions is a settings change.
# ---------------------------------------------------------------------------
layout:
  # .queue.NDIO_1 / .run.PDIO_1 / .complete.NTN_1
  # Case ids are cell names, not sequence numbers, so this stays loose.
  marker_regex: '^\.(?P<kind>queue|run|complete)\.(?P<case>.+)$'
  # Looser: anything shaped like a marker. Used to surface markers outside the
  # known three, which are abnormal and must be reported rather than ignored.
  marker_any_regex: '^\.(?P<kind>[A-Za-z_][A-Za-z0-9_]*)\.(?P<case>.+)$'

  # A log filename carries only a sequence number and says nothing about its
  # case. The mapping is:
  #   submit_bjob_cmd_file_1.log -> cmd_folder/cmd_file_1 -> `cd <path>` -> case
  log_regex: '^submit_bjob_cmd_file_(?P<num>\d+)\.log$'
  cmd_dir_name: "cmd_folder"
  cmd_file_template: "cmd_file_{num}"
  cmd_cd_regex: '^\s*cd\s+["'']?(?P<path>[^\s"'';#]+)'
  cmd_file_head_bytes: 16384

  # QC_Cc/ QC_Ct/ QC_Spice/ -- reports Arcx assembles, not case dirs
  report_dir_regex: '^QC_.+$'

  # Every cmd_file in cmd_folder is one submitted case. Enumerating them
  # directly is what makes the case roster independent of the directory
  # listing: a directory matching no marker and no cmd_file is reported as
  # "dir is not a case", never counted as one.
  cmd_file_regex: '^cmd_file_(?P<num>\d+)$'

  gds_globs: ["*.gds", "*.gds.gz", "*.GDS", "*.gds.bz2"]
  special_cfg_name: "special.cfg"
  special_cfg_cpu_key: "O_QCAP_LSF_NUM"
  dir_map_reserved_keys: ["min", "max"]

# ---------------------------------------------------------------------------
# Monitoring thresholds
# ---------------------------------------------------------------------------
monitor:
  # Fallback only, used when QA is switched off. Normally qa.quiet does the
  # grading and StateResolver promotes RUNNING to STALLED from its issue, so
  # keep this equal to qa.quiet.stalled_after_sec or the shorter clock wins.
  stall_threshold_sec: 28800     # 8h; log unchanged this long -> STALLED
  long_pend_warn_sec: 7200
  lost_grace_sec: 300            # wait this long after an LSF job vanishes
  log_head_bytes: 8192
  poll_active_sec: 30
  poll_idle_sec: 300

# ---------------------------------------------------------------------------
# Wave planning (architecture 5)
#   slots = O_QCAP_LSF_NUM * GDS count
# ---------------------------------------------------------------------------
plan:
  max_slots_per_wave: 200
  priority_keywords: ["sram", "ro"]   # path hits go into earlier waves
  keyword_ignore_case: true
  default_cpu_per_case: 0             # 0 = exclude rather than guess

# ---------------------------------------------------------------------------
# Submission gate (architecture 5.4)
#   release = min_interval elapsed AND (NJOBS < threshold OR max_wait elapsed)
# ---------------------------------------------------------------------------
gate:
  min_interval_sec: 600
  quota_threshold: 100
  max_wait_sec: 7200

# ---------------------------------------------------------------------------
# LSF (architecture 9.4)
# ---------------------------------------------------------------------------
lsf:
  bjobs_cmd: "bjobs"
  busers_cmd: "busers"
  bkill_cmd: "bkill"
  bsub_cmd: "bsub"
  bjobs_manage_cmd: "bjobs_manage.py"
  bjobs_manage_list_flag: "-jp"
  bjobs_manage_delete_flag: "-djp"
  command_timeout_sec: 60

  arcx_cmd: "Arcx"
  arcx_fixed_args: ["-lsf0", "-nt", "50"]
  arcx_rerun_args: ["-keep_dir"]

  # Draining a run folder before a rerun. Deletion can lag behind the request,
  # so the delete is reissued and rechecked this many times before giving up.
  # A job count that cannot be read is never treated as zero: it aborts.
  drain_attempts: 3
  drain_retry_delay_sec: 10

  # Drain safety gate: how many consecutive zero readings mean quiescent
  quiescent_confirm_times: 3
  quiescent_interval_sec: 30
  quiescent_timeout_sec: 900

# ---------------------------------------------------------------------------
# QA checks (architecture 7)
#
# Expected artifacts are **derived** from arcx.cfg rather than hard coded:
#
#   arcx.cfg                              case run dir
#   BEGIN_SETTINGS: <block>               <block>_<QC_FLOW>/
#     QC_FLOW = <flow>                      work_<QC_FLOW>/
#   END_SETTINGS                              <netlist for that flow>
# ---------------------------------------------------------------------------
qa:
  # What each EDA tool flow produces. Adding a tool means adding an entry here,
  # not changing code. Template variables: {flow} {block} {case}
  flows:
    calQCAP:
      work_dir: "work_{flow}"
      netlists: ["CCI_DB.spice"]      # fixed filename
      min_bytes: 1
    calQRCFS:
      work_dir: "work_{flow}"
      netlists: ["{case}.spf"]        # named after the cell
      min_bytes: 1

  # A netlist smaller than this is not a real result (the file was created and
  # the job died immediately).
  min_netlist_bytes: 1

  # Check ids to disable, so a rule can be turned off without deleting code.
  disabled_checks: []

  # --- PRE: arcx.cfg validation before submission --------------------------
  # Only these keys are verified as existing files or directories. An explicit
  # list rather than "anything that looks like a path": the latter produces
  # false alarms on output paths and on values such as TOOL_VERSION_LVS that
  # are a command plus arguments, and once there are false alarms nobody reads
  # the warnings.
  #
  # Lines disabled with a leading 0, or commented out with #, never take
  # effect and are therefore not checked.
  verify_cfg_paths: true
  cfg_path_keys:
    - RCX_TECH_QTF
    - RCX_LAYER_NAME_MAP
    - LVS_DFM_DIR
    - LVS_DECK
    - LVS_DECL
    - LVS_QUERY_CMD
    - RCX_STAR_CMD
  cfg_path_check_skip_keys: []

  reports:
    required_dirs: ["QC_Cc", "QC_Ct"]     # always present; missing is FATAL
    optional_dirs: ["QC_Spice"]           # checked only when present
    main_file_template: "Report_{dir}"
    # Report_QC_Cc_Summary_SCCB3 -- the suffix is naming, so glob; but there is
    # exactly one per directory, so more than one is also wrong.
    summary_glob_template: "Report_{dir}_Summary_*"

  # Thresholds for "the log has not grown in a while".
  # Graded rather than binary: a case can take ten minutes or three days, and
  # a log can legitimately go quiet because the artifacts are already written.
  quiet:
    warn_after_sec: 14400               # 4h   uncommon, worth a look
    stalled_after_sec: 28800            # 8h   effectively stuck
    downgrade_when_artifacts_ready: true

  # False success 1: a netlist that exists, is big enough, and is truncated.
  #
  # The extraction engine stamps its name on the netlist's first line, so that
  # line is the cheapest evidence it ran at all. Whether it is required depends
  # on special.cfg: with the extraction mode set to R the engine never runs and
  # the wording is correctly absent.
  netlist_signature:
    extraction_key: "O_EXTARCTION"        # spelled as the real files spell it
    resistance_only_value: "R"
    flow_signatures:
      calQCAP: "QuickCap"
    head_bytes: 4096

  # False success 2: a comparison in a QC_* Summary that produced no number.
  #
  #     refReport = <path>
  #     rep   item   refReport   cmpReport1   diffCmp1   ...
  #     <rep> <item> <number>    <number>     <number>
  #     ########
  #
  # Every column after the two naming columns must be a real number. Blank, the
  # word "fail", or a sentinel like 1e+15 all mean no answer was produced --
  # on a case otherwise reported complete, that is a false success.
  summary_table:
    dirs: ["QC_Spice"]                    # add QC_Cc / QC_Ct when confirmed
    ref_marker_regex: '^\s*refReport\s*='
    end_markers: ["########"]
    fail_words: ["fail"]
    fail_value_threshold: 1.0e+15
    name_columns: 2                       # rep, item
    max_bytes: 1048576
    max_reported: 20

# ---------------------------------------------------------------------------
# Pre-submission checks (architecture 5)
# ---------------------------------------------------------------------------
preflight:
  # Block submission below this free-space ratio on the target filesystem.
  # A full disk is the number one silent killer of RC extraction: jobs die part
  # way through, in a way that does not say why.
  min_disk_free_ratio: 0.05
  warn_disk_free_ratio: 0.15
  # Warn once NJOBS reaches this fraction of the gate threshold, since
  # submitting then only produces a pile of PEND.
  quota_warn_ratio: 0.8

# ---------------------------------------------------------------------------
# bsub parameters for submitting Arcx
#
#   bsub -q LVSRCE-0E.q -oo Arcx.log "Arcx -p arcx.cfg -d ... --run"
#
# Arcx itself is submitted to LSF so the daemon can restart without disturbing
# running work. The outer job is only a coordinator and reserves no resources;
# Arcx submits the real work as further LSF jobs.
# ---------------------------------------------------------------------------
launch:
  queue: "LVSRCE-0E.q"
  output_file: "Arcx.log"             # relative to the wave dir (bsub's cwd)
  job_name_template: "arcx_{run_id}_{wave}"
  bsub_args: []                       # e.g. ["-R", "rusage[mem=2048]"]

# ---------------------------------------------------------------------------
# Export to the shared disk (architecture 9.5)
#
# Derived data only. The truth lives in state_root and the run folders, so this
# can be deleted and rebuilt at any time.
# ---------------------------------------------------------------------------
# ---------------------------------------------------------------------------
# Automatic handling (architecture 7.9)
#
# Ships as **shadow**: the engine decides and records, and nothing acts. That is
# the point rather than a cautious default -- it lets the rules run against real
# failures for weeks, so turning automation on is a decision made against a log
# rather than against an intention.
#
#   python3 -m arcx_auto policy --wave-dir ...     what it would do right now
#   python3 -m arcx_auto policy --review RUN_ID    what it has recorded so far
#
# Only switch a rule to rerun_wave once the review says it would have fired on
# the cases you would have chosen yourself.
# ---------------------------------------------------------------------------
policy:
  mode: shadow                  # off | shadow | active

  # Budgets. These are the safety mechanism, not a safety net: the risk of an
  # automated action is never doing the wrong thing once, it is doing the right
  # thing two hundred times.
  max_auto_actions_per_run: 20
  cooldown_sec: 900
  # One issue id hitting more cases than this at once is a shared cause, and a
  # shared cause is not fixed by rerunning. This is what stops one broken cfg
  # from becoming two hundred reruns.
  same_issue_burst_limit: 5
  # Set by a person to stop everything without editing any rule below.
  global_kill_switch: false

  # Anything with no rule lands here. An issue the system has never seen is the
  # last thing that should be handled automatically.
  default_action: escalate
  default_class: unknown

  # action: rerun_wave | escalate | ignore
  # class:  transient | infra | setup | tool | verify_fail | unknown
  #         -- why it happens, which decides whether retrying can ever help.
  #            A setup failure retried a hundred times fails a hundred times.
  rules:
    # Verify failures always go to a person: the run says it succeeded and the
    # result is wrong, and deciding what that means needs judgement.
    NETLIST_NO_SIGNATURE:   {action: escalate, class: verify_fail}
    SUMMARY_TABLE_BAD_VALUE: {action: escalate, class: verify_fail}
    SUMMARY_TABLE_UNREADABLE: {action: escalate, class: unknown}

    # The clearest "it did not finish", and so the first candidates for
    # automation once the shadow log says they behave.
    NETLIST_MISSING: {action: escalate, class: tool, max_auto: 1}
    NETLIST_EMPTY:   {action: escalate, class: tool, max_auto: 1}

    # Setup failures would fail identically every time.
    FLOW_DIR_MISSING:            {action: escalate, class: setup}
    CFG_EXPECTATION_PROBLEM:     {action: escalate, class: setup}
    CFG_EXPECTATION_UNAVAILABLE: {action: escalate, class: unknown}
    CASE_NEVER_STARTED:          {action: escalate, class: setup}

    CASE_QUIET:        {action: escalate, class: unknown}
    LSF_SUSPENDED:     {action: escalate, class: infra}
    QA_INTERNAL_ERROR: {action: escalate, class: unknown}

# ---------------------------------------------------------------------------
# Shared-disk export (architecture 9.6)
# ---------------------------------------------------------------------------
export:
  shared_root: "/tmp1/.auto_golden"
  # Independent of the daemon tick on purpose: the daemon polls every 30s while
  # cases run, and rewriting files on a shared NFS mount that often is rude to
  # everybody who has it mounted.
  interval_sec: 60
  # Runs carried on the exported page, newest first. This is the history:
  # enough to answer "did this ever work" without piling every run a user has
  # ever done onto one page.
  history_limit: 50
  # Publish automatically from the daemon. Turning this off leaves `export`
  # available as a manual command.
  enabled: true
  # Octal, in the YAML 1.1 form this parser understands (0755, not 0o755).
  dir_mode: 0755
  file_mode: 0644
