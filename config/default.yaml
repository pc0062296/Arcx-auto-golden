# Arcx Auto Golden 預設設定
#
# 這個檔案是可選的 —— 所有欄位都有內建預設值, 沒有設定檔也能跑。
# 只需要寫下你要覆寫的欄位。
#
# 尋找順序: ./arcx_auto.yaml  ->  ~/.arcx-auto/config/default.yaml
# 也可以用 -c/--config 明確指定 (支援 .yaml 或 .json)。
# 內網若沒有 PyYAML, 改用 .json 格式即可, 內容結構完全相同。

state_root: "~/.arcx-auto"     # 個人狀態目錄 (state.json / events.jsonl / audit.jsonl)
run_root: "./arcx_runs"        # wave 隔離目錄的根

# ---------------------------------------------------------------------------
# 檔案慣例 (architecture §9.3)
# 對外部世界的所有假設都集中在這裡, 不寫死在程式邏輯中。
# ---------------------------------------------------------------------------
layout:
  # .queue.NDIO_1 / .run.PDIO_1 / .complete.NTN_1
  # case id 是 cell 名稱, 不是流水號, 所以這裡必須用寬鬆的 .+
  marker_regex: '^\.(?P<kind>queue|run|complete)\.(?P<case>.+)$'

  # log 檔名只有流水號, 與 case 沒有任何關係。對應方式:
  #   submit_bjob_cmd_file_1.log -> cmd_folder/cmd_file_1 -> `cd <path>` -> case
  log_regex: '^submit_bjob_cmd_file_(?P<num>\d+)\.log$'
  cmd_dir_name: "cmd_folder"
  cmd_file_template: "cmd_file_{num}"
  cmd_cd_regex: '^\s*cd\s+["'']?(?P<path>[^\s"'';#]+)'
  cmd_file_head_bytes: 16384

  # QC_Cc/ QC_Ct/ QC_Spice/  <- Arcx 整理的 report, 不是 case dir
  report_dir_regex: '^QC_.+$'

  # case run dir 的名字就是 cell 名稱, 沒有共同樣式, 因此用排除法辨識:
  # run folder 底下不符合這些樣式的目錄, 就是 case run dir (rerun 時刪這些)。
  # 環境中若出現新的非 case 目錄, 加進這個清單即可, 不需要改程式。
  non_case_dir_regexes: ['^QC_.+$', '^cmd_folder$', '^\..*$']

  gds_globs: ["*.gds", "*.gds.gz", "*.GDS", "*.gds.bz2"]
  special_cfg_name: "special.cfg"
  special_cfg_cpu_key: "O_QCAP_LSF_NUM"
  dir_map_reserved_keys: ["min", "max"]

# ---------------------------------------------------------------------------
# 監控門檻
# ---------------------------------------------------------------------------
monitor:
  stall_threshold_sec: 3600      # log 連續多久沒成長算 STALLED
  long_pend_warn_sec: 7200
  lost_grace_sec: 300            # LSF job 消失後等多久才敢判 LOST
  log_head_bytes: 8192
  poll_active_sec: 30
  poll_idle_sec: 300

# ---------------------------------------------------------------------------
# 分波 (architecture §5)
#   slots = O_QCAP_LSF_NUM x GDS 數
# ---------------------------------------------------------------------------
plan:
  max_slots_per_wave: 200
  priority_keywords: ["sram", "ro"]   # path 命中者優先排入前面的 wave
  keyword_ignore_case: true
  default_cpu_per_case: 0             # 0 = 讀不到 special.cfg 就排除, 不猜

# ---------------------------------------------------------------------------
# 提交閘門 (architecture §5.4)
#   放行 = 已過 min_interval AND ( NJOBS < quota_threshold OR 已過 max_wait )
# ---------------------------------------------------------------------------
gate:
  min_interval_sec: 600
  quota_threshold: 100
  max_wait_sec: 7200

# ---------------------------------------------------------------------------
# LSF (architecture §9.4)
# ---------------------------------------------------------------------------
lsf:
  bjobs_cmd: "bjobs"
  busers_cmd: "busers"
  bkill_cmd: "bkill"
  bsub_cmd: "bsub"
  bjobs_manage_cmd: "bjobs_manage.py"
  bjobs_manage_list_flag: "-jp"
  bjobs_manage_delete_flag: "-djp"
  command_timeout_sec: 60

  arcx_cmd: "Arcx"
  arcx_fixed_args: ["-lsf0", "-nt", "50"]
  arcx_rerun_args: ["-keep_dir"]

  # drain 安全門: 連續幾次確認 0 job 才算靜止
  quiescent_confirm_times: 3
  quiescent_interval_sec: 30
  quiescent_timeout_sec: 900

# ---------------------------------------------------------------------------
# QA 檢查 (architecture §7)
#
# 期望產出物是從 arcx.cfg **推導**出來的, 不是寫死的:
#
#   arcx.cfg                              case run dir
#   BEGIN_SETTINGS: <block>               <block>_<QC_FLOW>/
#     QC_FLOW = <flow>                      work_<QC_FLOW>/
#   END_SETTINGS                              <該 flow 的 netlist>
# ---------------------------------------------------------------------------
qa:
  # 每個 EDA tool flow 產出什麼。新增一種 tool = 在這裡加一個項目, 不需要改程式。
  # 樣板變數: {flow} {block} {case}
  flows:
    calQCAP:
      work_dir: "work_{flow}"
      netlists: ["CCI_DB.spice"]      # 固定檔名
      min_bytes: 1
    calQRCFS:
      work_dir: "work_{flow}"
      netlists: ["{case}.spf"]        # 檔名跟著 cell 走
      min_bytes: 1

  # netlist 小於這個大小視為無效 (檔案被建立後 job 立刻死掉的情況)
  min_netlist_bytes: 1

  # 要停用的檢查 id。放在這裡就不用刪程式。
  disabled_checks: []

  reports:
    required_dirs: ["QC_Cc", "QC_Ct"]     # 一定會存在, 缺了是 FATAL
    optional_dirs: ["QC_Spice"]           # 有才檢查內容
    main_file_template: "Report_{dir}"
    # Report_QC_Cc_Summary_SCCB3 —— 後綴會變, 所以用 glob
    summary_glob_template: "Report_{dir}_Summary_*"

  # 「多久沒寫 log」的分級門檻。
  # 刻意分級而非二元判定: 單一 case runtime 從 10 分鐘到 3 天都有,
  # 而且存在「不寫 log 但產出物已經齊了」的正常情況。
  quiet:
    warn_after_sec: 14400               # 4h  少見, 值得看一眼
    stalled_after_sec: 28800            # 8h  基本上可判定卡住
    downgrade_when_artifacts_ready: true

# ---------------------------------------------------------------------------
# 公用碟匯出 (architecture §9.5)
# 只放衍生資料 —— 真相永遠在 state_root 與 run folder, 這裡可隨時整個重建。
# ---------------------------------------------------------------------------
export:
  shared_root: "/tmp1/.auto_golden"
  interval_sec: 60
